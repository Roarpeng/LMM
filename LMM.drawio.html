0\&quot; x=\&quot;290\&quot; y=\&quot;590\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;o_oPj8fCEtpqFpxQOzQi-18\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;o_oPj8fCEtpqFpxQOzQi-2\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;\&quot; target=\&quot;o_oPj8fCEtpqFpxQOzQi-19\&quot; value=\&quot;\&quot;&gt;\n          &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;\n            &lt;mxPoint x=\&quot;190\&quot; y=\&quot;490\&quot; as=\&quot;sourcePoint\&quot; /&gt;\n            &lt;mxPoint x=\&quot;350\&quot; y=\&quot;690\&quot; as=\&quot;targetPoint\&quot; /&gt;\n          &lt;/mxGeometry&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;o_oPj8fCEtpqFpxQOzQi-19\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;rounded=0;\&quot; value=\&quot;否\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;30\&quot; width=\&quot;60\&quot; x=\&quot;320\&quot; y=\&quot;475\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;o_oPj8fCEtpqFpxQOzQi-22\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;o_oPj8fCEtpqFpxQOzQi-20\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;entryX=1;entryY=0.5;entryDx=0;entryDy=0;\&quot; target=\&quot;o_oPj8fCEtpqFpxQOzQi-4\&quot;&gt;\n          &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;o_oPj8fCEtpqFpxQOzQi-20\&quot; parent=\&quot;1\&quot; style=\&quot;whiteSpace=wrap;html=1;rounded=0;\&quot; value=\&quot;排查完成问题，手动控制Y轴，Z轴，R轴回零点\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;60\&quot; width=\&quot;120\&quot; x=\&quot;290\&quot; y=\&quot;820\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;o_oPj8fCEtpqFpxQOzQi-23\&quot; parent=\&quot;1\&quot; style=\&quot;whiteSpace=wrap;html=1;rounded=0;\&quot; value=\&quot;运行完成，Y轴，Z轴，R轴回零位等待\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;60\&quot; width=\&quot;120\&quot; x=\&quot;70\&quot; y=\&quot;1260\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;o_oPj8fCEtpqFpxQOzQi-25\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;overflow=hidden;rounded=0;\&quot; value=\&quot;&amp;lt;h1 style=&amp;quot;margin-top: 0px;&amp;quot;&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/h1&amp;gt;&amp;lt;p&amp;gt;一个龙门架构的4轴设备，X轴是地面行走轴，分布在龙门的两侧。Y轴是横向移动的轴，Y轴伺服电机装在衡量的一侧。Y轴运动平台上安装有Z轴，Z轴是一个滑台，Z轴末端有安装R轴负责角度旋转。&amp;lt;br&amp;gt;1. X轴有2个伺服电机，Y轴1个伺服电机，Z轴1个伺服电机，R轴1个伺服电机。&amp;lt;br&amp;gt;2. Y轴、Z轴和R轴需要回零。Y轴和Z轴使用硬件限位回零模式，R轴使用的是单圈绝对值伺服，使用的是编码器回零&amp;lt;br&amp;gt;3. 控制要求，可以通过HMI触摸屏和WEBHMI来进行控制。webHMI激活的时候优先webHMI，其次是HMI触摸屏:&amp;lt;/p&amp;gt;&amp;lt;blockquote style=&amp;quot;margin: 0 0 0 40px; border: none; padding: 0px;&amp;quot;&amp;gt;&amp;lt;p&amp;gt;手动模式：&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;a.手动可以控制X轴的前进后退，原地转向(左转，右转)。行走速度，转向速度&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;b. 手动可以控制Y,Z,R的移动，回零，运动速度&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;c. Y,Z,R各轴的位移限位需要硬性保障&amp;lt;/p&amp;gt;&amp;lt;/blockquote&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;自动模式:&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;p&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;龙门设备是一个给专用道路挂水槽的设备。道路挂的水槽有深度一致的要求。具体流程是，龙门设备走到刚铺好的混泥土道路上。前进一段距离，Y轴横向运动，运动过程中保持Z轴的压力&amp;lt;br/&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;不变。R轴的角度不变。&amp;lt;br/&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;行走过程需要保持直线行走，会在龙门架的两侧装有摄像头，通过视觉来纠正角度。&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/p&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;310\&quot; width=\&quot;1090\&quot; y=\&quot;-60\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n      &lt;/root&gt;\n    &lt;/mxGraphModel&gt;\n  &lt;/diagram&gt;\n&lt;/mxfile&gt;\n&quot;}"></div>
